function exDef(id){

  for(const [,l] of CATALOG){const e=l.find(x=>x.id===id); if(e) return e}
  const c=(S.aj.custom||{})[id]; if(c) return c;
  for(const s of Object.values(S.sessions)){const d=s.defs&&s.defs[id]; if(d) return d}
  return {id,n:id.replace(/^c_/,"").replace(/_/g," "),lo:8,hi:12,inc:2.5,s:3};
}

function sessionExercises(s){
  const P=PROGRAM[s.tipo]; const fix=(S.aj.swaps||{})[s.tipo]||{}; const ch=s.cambios||{}; const quit=s.quitados||[]; const ns=s.nsets||{};
  const out=[];
  P.ex.forEach((base,idx)=>{
    if(quit.includes(base.id)) return;
    const id=ch[base.id]||fix[base.id]||base.id;
    const d=id===base.id?base:Object.assign({},exDef(id),{ss:base.ss,s:base.s});
    out.push(Object.assign({},d,{slot:base.id,idx,swapped:id!==base.id,fixed:!ch[base.id]&&!!fix[base.id]}));
  });
  ((S.aj.extras||{})[s.tipo]||[]).concat(s.extras||[]).forEach((id,k)=>{ if(quit.includes(id)||out.some(e=>e.id===id)) return; const d=exDef(id); out.push(Object.assign({},d,{slot:id,idx:99+k,extra:true,ss:null,s:d.s||3})); });
  out.forEach(e=>{ if(ns[e.id]) e.s=ns[e.id]; });
  return out;
}

async function flush(){
  if(flushing||!sb||!S.user) return; flushing=true;

    for(const key of Object.keys(outbox)){
      const {table,row}=outbox[key]; if(!row.user_id) row.user_id=S.user.id;

      if(outbox[key]&&outbox[key].row===row){ delete outbox[key]; LS.set("outbox",outbox); }

}

/* ============ Lógica de entrenamiento ============ */
function sessionList(){return Object.values(S.sessions).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.creado||0)-(b.creado||0))}
function nextType(){
  const done = sessionList().filter(s=>s.terminada);
  if(!done.length) return "TA";
  const last = done[done.length-1].tipo;
  return ROTATION[(ROTATION.indexOf(last)+1)%4];
}
function weekSessions(mon){const end=addDays(mon,6);return sessionList().filter(s=>s.terminada&&s.fecha>=mon&&s.fecha<=end)}
function lastFor(exId, beforeId){
  const lim=(S.cur&&S.cur.id===beforeId)?S.cur.fecha:"9999";
  const list = sessionList().filter(s=>s.id!==beforeId && s.fecha<=lim && s.ejercicios && s.ejercicios[exId] && s.ejercicios[exId].some(x=>x&&x.kg!=null&&x.reps!=null));
  return list.length? list[list.length-1].ejercicios[exId].filter(x=>x&&x.kg!=null&&x.reps!=null):null;
}
function suggestion(ex, beforeId, w){
  const last = lastFor(ex.id, beforeId);
  if(!last) return {txt:w<=1?"Primera vez: busca un peso que te deje 3 reps en reserva.":"Sin registro previo: parte conservador.",kg:null};
  const topKg = Math.max(...last.map(x=>+x.kg));
  const top = last.filter(x=>+x.kg===topKg);
  const allHit = last.length>=ex.s && top.every(x=>+x.reps>=ex.hi);
  const prev = last.map(x=>`${fmtKg(x.kg)}×${x.reps}`).join(", ");
  if(w===7){const k=Math.round(topKg*0.9/1.25)*1.25;return {txt:`La vez pasada: ${prev}. Descarga: ${fmtKg(k)} kg, una serie menos.`,kg:k}}
  if(allHit && ex.inc>0) return {txt:`La vez pasada: ${prev}. Llegaste arriba en todo: sube a <b>${fmtKg(topKg+ex.inc)} kg</b> y vuelve a ${ex.lo} reps.`,kg:topKg+ex.inc};
  return {txt:`La vez pasada: ${prev}. Mismo peso, <b>${fmtKg(topKg)} kg</b>, y busca una rep más.`,kg:topKg};
}
function platesFor(kg,bar){let side=(kg-bar)/2; if(side<=0) return `Solo la barra (${bar} kg)`;
  const out=[];for(const p of [25,20,15,10,5,2.5,1.25]){while(side>=p-1e-9){out.push(p);side-=p}}
  return `Por lado: ${out.map(fmtKg).join(" + ")}${side>0.01?" (sobra "+fmtKg(side*2)+" kg)":""} · barra ${bar} kg`;}
function bestBefore(exId,sid){let b=0;const lim=(S.cur&&S.cur.id===sid)?S.cur.fecha:"9999";for(const s of sessionList()){if(s.id===sid||s.fecha>lim)continue;((s.ejercicios||{})[exId]||[]).forEach(x=>{if(x&&x.kg!=null&&x.reps!=null)b=Math.max(b,e1rm(+x.kg,+x.reps))})}return b}
function sessStats(s){let vol=0,n=0;Object.values(s.ejercicios||{}).forEach(a=>a.forEach(x=>{if(x&&x.ok){n++;vol+=(+x.kg||0)*(+x.reps||0)}}));return {vol,n}}
function updSessbar(){const el=$("#sessbar");if(!el||!S.cur)return;const st=sessStats(S.cur);const mins=S.cur.inicio?Math.floor((Date.now()-S.cur.inicio)/60000):0;
  el.innerHTML=`<span>Duración <b>${S.cur.inicio?mins+" min":"sin partir"}</b></span><span>Series <b>${st.n}</b></span><span>Volumen <b>${Math.round(st.vol).toLocaleString("es-CL")} kg</b></span>`}

function weightSpark(days){
  const pts=days.filter(d=>typeof d.peso==="number");
  if(pts.length<2) return `<p class="empty">Registra tu peso unos días y aquí aparece la curva con el promedio móvil.</p>`;
  const W=320,H=120,pl=34,pr=8,pt=10,pb=20;
  const xs=pts.map(p=>parse(p.fecha).getTime());const x0=Math.min(...xs),x1=Math.max(...xs);
  const ys=pts.map(p=>p.peso);let y0=Math.floor(Math.min(...ys)-0.5),y1=Math.ceil(Math.max(...ys)+0.5);
  const X=t=>pl+(x1===x0?0:(t-x0)/(x1-x0))*(W-pl-pr), Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  const ma=pts.map((p,i)=>{const win=pts.filter(q=>parse(q.fecha)<=parse(p.fecha)&&(parse(p.fecha)-parse(q.fecha))/864e5<7);return [X(xs[i]),Y(avg(win.map(q=>q.peso)))]});
  const grid=[y0,(y0+y1)/2,y1].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v,1)}</text>`).join("");
  const dots=pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.peso)}" r="2.5" fill="var(--muted)"/>`).join("");
  const line=ma.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=ma[ma.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Peso diario y promedio de 7 días">${grid}${dots}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--accent)"/><text x="${pl}" y="${H-4}">${pretty(pts[0].fecha).split(" ").slice(1).join(" ")}</text><text x="${W-pr}" y="${H-4}" text-anchor="end">${pretty(pts[pts.length-1].fecha).split(" ").slice(1).join(" ")}</text></svg>`;
}

function weekStats(mon){

  const ds=dates.map(x=>S.days[x]||{});const hs=dates.map(x=>S.health[x]||{});
  const meals=ds.reduce((a,d)=>a+MEALS.filter(m=>d.comidas&&d.comidas[m.id]!=null).length,0);
  return {n:dates.length,peso:avg(ds.map(d=>d.peso)),ses:weekSessions(mon).length,meals:dates.length?meals/(dates.length*4):null,
    sueno:avg(hs.map(h=>h.sueno_horas!=null?+h.sueno_horas:null)),pasos:avg(dates.map(x=>stepsOf(x))),
    energia:avg(ds.map(d=>d.energia)),animo:avg(ds.map(d=>d.animo)),agua:avg(ds.map(d=>d.agua)),fc:avg(hs.map(h=>h.fc_reposo!=null?+h.fc_reposo:null)),vfc:avg(hs.map(h=>h.vfc!=null?+h.vfc:null))};

function exSpark(h){if(h.length<2)return "";const W=320,H=90,pl=30,pr=8,pt=8,pb=16;const ys=h.map(x=>x.best);const y0=Math.floor(Math.min(...ys)*0.97),y1=Math.ceil(Math.max(...ys)*1.03);

  const path=h.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x.best).toFixed(1)).join(" ");

  const lastGym=sessionList().filter(s=>s.terminada).map(s=>s.fecha).sort().pop();

  const exHist=[];sessionList().forEach(s=>{const r=((s.ejercicios||{})[S.exSel]||[]).filter(x=>x&&x.kg!=null&&x.reps!=null);if(r.length)exHist.push({f:s.fecha,sets:r,best:Math.max(...r.map(x=>e1rm(+x.kg,+x.reps))),top:Math.max(...r.map(x=>+x.kg))})});

async function exportXlsx(){
  if(!window.XLSX){toast("No cargó la herramienta de Excel. Recarga la página.");return}
  const wb=XLSX.utils.book_new();
  const days=Object.values(S.days).filter(d=>/^\d{4}-/.test(d.fecha||"")).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const allDates=[...new Set([...days.map(d=>d.fecha),...Object.keys(S.health)])].sort();
  const prog=[["Fecha","Semana","Peso (kg)","Promedio 7 días","Pasos","Sueño (h)","Se durmió","Despertó","FC reposo","Variabilidad","Energía","Ánimo","Agua (ml)","Comidas cumplidas","Creatina","Omega 3","Cheat","Cintura (cm)","Nota"]];
  allDates.forEach(f=>{const d=S.days[f]||{},h=S.health[f]||{};const win=days.filter(q=>q.fecha<=f&&q.fecha>addDays(f,-7)&&typeof q.peso==="number");
    prog.push([f,weekOf(f),d.peso??"",win.length?+avg(win.map(q=>q.peso)).toFixed(2):"",stepsOf(f)??"",h.sueno_horas!=null?+h.sueno_horas:"",h.hora_dormir||d.dormir||"",h.hora_despertar||d.despertar||"",h.fc_reposo??"",h.vfc!=null?+h.vfc:"",d.energia??"",d.animo??"",d.agua??"",MEALS.filter(x=>d.comidas&&d.comidas[x.id]!=null).length,d.creatina?"sí":"",d.omega?"sí":"",d.cheat?"sí":"",d.cintura??"",d.nota||""])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(prog),"Progreso");
  ROTATION.forEach(k=>{const P=PROGRAM[k];const ss=sessionList().filter(s=>s.tipo===k&&s.terminada);
    const aoa=[[P.name+" · "+P.focus],["Ejercicio","Series","Reps objetivo",...ss.map(s=>s.fecha+" (S"+s.semana+")")]];
    const ids=[...P.ex.map(e=>e.id)]; ss.forEach(s=>Object.keys(s.ejercicios||{}).forEach(id=>{if(!ids.includes(id))ids.push(id)}));
    ids.map(exDef).forEach(ex=>{const mx=Math.max(ex.s||0,...ss.map(s=>((s.ejercicios||{})[ex.id]||[]).length));
      aoa.push([ex.n,ex.s,ex.lo+" a "+ex.hi]);
      for(let i=0;i<mx;i++) aoa.push(["   Serie "+(i+1),"","",...ss.map(s=>{const r=((s.ejercicios||{})[ex.id]||[])[i];return r&&r.reps!=null?`${r.kg!=null?fmtKg(r.kg):"?"} x ${r.reps}`:""})]);});
    const ws=XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=[{wch:38},{wch:7},{wch:12},...ss.map(()=>({wch:14}))];
    XLSX.utils.book_append_sheet(wb,ws,P.name);});
  const flat=[["Fecha","Semana","Sesión","Ejercicio","Serie","Kg","Reps","1RM estimado"]];
  sessionList().forEach(s=>{Object.keys(s.ejercicios||{}).map(exDef).forEach(ex=>{((s.ejercicios||{})[ex.id]||[]).forEach((r,i)=>{if(r&&r.reps!=null)flat.push([s.fecha,s.semana,PROGRAM[s.tipo].name,ex.n,i+1,r.kg??"",r.reps,r.kg!=null?Math.round(e1rm(+r.kg,+r.reps)*10)/10:""])})})});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(flat),"Todas las series");
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const name="Bitacora Cristobal "+today()+".xlsx";
  const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  try{
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("Excel listo")
}

function pickerHtml(){
  const P=S.picker; if(!P) return "";
  if(P.step==="scope"){
    return `<div class="lb" id="pk"><div class="sheet"><h3>${esc(exName(P.newId))}</h3><p class="small muted">en vez de ${esc(exName(P.slot))}</p>
      <button class="btn primary" data-scope="hoy">Solo hoy</button><button class="btn" data-scope="fijo">Siempre en ${esc(PROGRAM[S.cur.tipo].name)}</button><button class="btn ghost" data-pkclose="1">Cancelar</button></div></div>`;
  }
  const q=(P.q||"").trim().toLowerCase();
  const inSes=new Set(S.cur?sessionExercises(S.cur).map(e=>e.id):[]);
  const groups=[["Tu rutina",Object.values(PROGRAM).flatMap(p=>p.ex)],["Tuyos",Object.values(S.aj.custom||{})],...CATALOG];

  groups.forEach(([g,list])=>{

    ${dates.length?`<div class="flat" style="border-top:1px solid var(--line);padding-top:12px">${gallery}</div>`:(S.fotos===null?"":`<p class="empty">Todavía no hay fotos. Sube la primera con los botones de arriba.</p>`)}
  </section>
  ${S.lb?`<div class="lb" id="lb"><img src="${S.fotoUrls[S.lb]||""}" alt=""><div class="row"><button class="btn" id="lbClose">Cerrar</button><button class="btn ghost" id="lbDel" style="color:var(--bad)">${S.lbDel?"Toca otra vez para borrar":"Borrar foto"}</button></div></div>`:""}`;
}
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
    const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.85));
  }catch(e){return file}
}
function bindFotos(){
  const fd=$("#fotoDate"); if(fd) fd.onchange=()=>{if(fd.value&&fd.value<=today()){S.fotoDate=fd.value;render()}};
  document.querySelectorAll("[data-up]").forEach(inp=>inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    if(!navigator.onLine){toast("Necesitas señal para subir fotos");return}
    const msg=$("#upMsg"); if(msg) msg.textContent="Subiendo foto…";
    const blob=await shrink(f); const v=inp.dataset.up; const d=S.fotoDate||today();
    const old=(fotosByDate()[d]||{})[v];
    const path=S.user.id+"/"+d+"_"+v+"_"+Date.now()+".jpg";
    const {error}=await sb.storage.from("fotos").upload(path,blob,{contentType:"image/jpeg",upsert:false});
    if(error){ if(msg) msg.textContent="No se pudo subir: "+error.message; return; }
    if(old) await sb.storage.from("fotos").remove([old.path]);
    if(d===today()&&parse(d).getDay()===0) saveDay(d,{foto:true});
    toast("Foto guardada"); await loadFotos(); render();
  });
  document.querySelectorAll("[data-cmpv]").forEach(b=>b.onclick=()=>{S.cmpV=b.dataset.cmpv;render()});
  const a=$("#cmpA"); if(a) a.onchange=()=>{S.cmpA=a.value;render()};
  const b=$("#cmpB"); if(b) b.onchange=()=>{S.cmpB=b.value;render()};
  document.querySelectorAll("[data-lb]").forEach(x=>x.onclick=()=>{S.lb=x.dataset.lb;S.lbDel=false;render()});
  const lc=$("#lbClose"); if(lc) lc.onclick=()=>{S.lb=null;render()};
  const lbx=$("#lb"); if(lbx) lbx.onclick=e=>{if(e.target===lbx){S.lb=null;render()}};
  const ld=$("#lbDel"); if(ld) ld.onclick=async()=>{ if(!S.lbDel){S.lbDel=true;render();return}
    const {error}=await sb.storage.from("fotos").remove([S.lb]); if(error){toast("No se pudo borrar: "+error.message);return}
    delete S.fotoUrls[S.lb]; S.lb=null; S.lbDel=false; toast("Foto borrada"); await loadFotos(); render(); };
}

/* ============ Eventos ============ */
function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const t=today();
  const num=(id,key)=>{const el=$("#"+id);if(el)el.onchange=()=>{const v=el.value===""?null:parseFloat(el.value.replace(",","."));saveDay(t,{[key]:v});toast("Guardado")}};
  num("peso","peso"); num("cintura","cintura");
  const gf=$("#goFotos"); if(gf) gf.onclick=()=>{S.fotoDate=today();go("historial");setTimeout(()=>{const f=$("#fotos");if(f)f.scrollIntoView({behavior:"smooth"})},50)};
  const pa=$("#pasosAyer"); if(pa) pa.onchange=()=>{saveDay(addDays(t,-1),{pasos:pa.value===""?null:parseInt(pa.value,10)});toast("Guardado");render()};
  document.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>{S.calSel=b.dataset.cal;render()});
  document.querySelectorAll("[data-mon]").forEach(b=>b.onclick=()=>{const [y,m]=S.calMonth.split("-").map(Number);const d=new Date(y,m-1+(+b.dataset.mon),1);S.calMonth=ymd(d).slice(0,7);render()});
  const xb=$("#exportX"); if(xb) xb.onclick=exportXlsx;
  const es=$("#exSel"); if(es) es.onchange=()=>{S.exSel=es.value;render()};
  ["dormir","despertar"].forEach(k=>{const el=$("#"+k);if(el)el.onchange=()=>saveDay(t,{[k]:el.value||null})});
  const nota=$("#nota"); if(nota) nota.oninput=()=>saveDay(t,{nota:nota.value});
  document.querySelectorAll("[data-water]").forEach(b=>b.onclick=()=>{const cur=(S.days[t]||{}).agua||0;saveDay(t,{agua:Math.max(0,cur+ +b.dataset.water)});render()});
  document.querySelectorAll("[data-flag]").forEach(b=>b.onclick=()=>{const k=b.dataset.flag;saveDay(t,{[k]:!((S.days[t]||{})[k])});render()});
  document.querySelectorAll("[data-scale]").forEach(b=>b.onclick=()=>{saveDay(t,{[b.dataset.scale]:+b.dataset.v});render()});
  document.querySelectorAll("[data-meal]").forEach(b=>b.onclick=()=>{const c=((S.days[t]||{}).comidas||{});const v=+b.dataset.v;saveDay(t,{comidas:{[b.dataset.meal]:c[b.dataset.meal]===v?null:v}});render()});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{S.pick=b.dataset.pick;render()});
  document.querySelectorAll(".sets input").forEach(inp=>inp.onchange=()=>{
    const s=S.cur; delete s.nuevo; if(!s.inicio&&s.fecha===today()) s.inicio=Date.now(); const arr=(s.ejercicios[inp.dataset.ex]||[]).slice();
    const r=Object.assign({},arr[+inp.dataset.i]||{});
    r[inp.dataset.f]= inp.value===""?null:parseFloat(inp.value.replace(",","."));
    arr[+inp.dataset.i]=r; s.ejercicios=Object.assign({},s.ejercicios,{[inp.dataset.ex]:arr});
    for(let i=0;i<arr.length;i++) if(!arr[i]) arr[i]={};
    saveSession(s.id,s);
  });
  document.querySelectorAll(".restbtn").forEach(b=>b.onclick=()=>startTimer(+b.dataset.rest,b.dataset.lab));
  document.querySelectorAll(".sets .ok").forEach(b=>b.onclick=()=>{
    const s=S.cur; delete s.nuevo; if(!s.inicio&&s.fecha===today()) s.inicio=Date.now();
    const id=b.dataset.ok,i=+b.dataset.i; const arr=(s.ejercicios[id]||[]).slice(); for(let k=0;k<=i;k++) if(!arr[k]) arr[k]={};
    const r=Object.assign({},arr[i]); const kgI=$("#kg_"+id+"_"+i), rpI=$("#rp_"+id+"_"+i);
    if(r.ok){r.ok=false;arr[i]=r;s.ejercicios=Object.assign({},s.ejercicios,{[id]:arr});saveSession(s.id,s);render();return}
    if(r.kg==null&&kgI.placeholder&&!isNaN(parseFloat(kgI.placeholder.replace(",","."))))r.kg=parseFloat(kgI.placeholder.replace(",","."));
    if(r.reps==null)r.reps=parseInt(rpI.placeholder,10)||null;
    if(r.reps==null){toast("Anota las reps de la serie");return}
    r.ok=true; arr[i]=r; s.ejercicios=Object.assign({},s.ejercicios,{[id]:arr}); saveSession(s.id,s);
    const ex=curEx(id); const prevBest=bestBefore(id,s.id);
    if(r.kg!=null&&prevBest>0&&e1rm(+r.kg,+r.reps)>prevBest+0.01) setTimeout(()=>toast("Récord en "+ex.n+": "+fmtKg(r.kg)+" × "+r.reps),300);
    try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
    let start=true; if(ex&&ex.ss){const grp=sessionExercises(s).filter(e=>e.ss===ex.ss); if(grp.length>1&&grp[grp.length-1].id!==id) start=false;}
    if(start&&s.fecha===today()) startTimer(+b.dataset.rest,b.dataset.lab);
    render();
  });
  updSessbar(); wake(S.tab==="entreno");
  const fin=$("#finish"); if(fin) fin.onclick=()=>{
    const s=S.cur; const any=Object.values(s.ejercicios||{}).some(a=>a.some(x=>x&&x.reps!=null));
    if(!any){toast("Anota al menos una serie antes de terminar");return}
    const past=s.fecha<today(), wasDone=s.terminada;
    delete s.nuevo; s.terminada=true; if(!wasDone) s.terminadaEn=Date.now();
    if(past){ const pm=$("#pastMin"); if(pm&&pm.value!=="") s.minutos=parseInt(pm.value,10); s.pasado=true; }
    else if(s.inicio&&!wasDone) s.minutos=Math.round((s.terminadaEn-s.inicio)/60000);
    let vol=0; Object.values(s.ejercicios||{}).forEach(a=>a.forEach(x=>{if(x&&x.reps!=null&&(x.ok||past))vol+=(+x.kg||0)*(+x.reps||0)})); s.volumen=Math.round(vol);
    saveSession(s.id,s); S.pick=null; toast(PROGRAM[s.tipo].name+" guardado");
    if(past||S.editId){ S.calSel=s.fecha; S.calMonth=s.fecha.slice(0,7); S.editId=null; S.entDate=null; go("historial"); } else go("hoy");
  };
  const ed=$("#entDate"); if(ed) ed.onchange=()=>{ if(!ed.value||ed.value>today()){ed.value=S.entDate||today();return} S.entDate=ed.value===today()?null:ed.value; S.pick=null; render(); };
  const ce=$("#cancelEdit"); if(ce) ce.onclick=()=>{S.editId=null;S.entDate=null;S.pick=null;render()};
  const pm=$("#pastMin"); if(pm) pm.onchange=()=>{const s=S.cur; delete s.nuevo; s.minutos=pm.value===""?null:parseInt(pm.value,10); saveSession(s.id,s)};
  document.querySelectorAll("[data-addday]").forEach(b=>b.onclick=()=>{S.editId=null;S.pick=null;S.entDate=b.dataset.addday===today()?null:b.dataset.addday;go("entreno")});
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{S.editId=b.dataset.edit;S.entDate=null;go("entreno")});
  bindFotos(); bindPicker();
  document.querySelectorAll("[data-addex]").forEach(b=>b.onclick=()=>{S.picker={mode:"add",q:""};render()});
  document.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>{
    const slot=b.dataset.swap, s=S.cur;
    if((s.extras||[]).includes(slot)||((S.aj.extras||{})[s.tipo]||[]).includes(slot)){ s.extras=(s.extras||[]).filter(x=>x!==slot); s.quitados=(s.quitados||[]).concat(((S.aj.extras||{})[s.tipo]||[]).includes(slot)?[slot]:[]); touch(s); S.picker={mode:"add",q:""}; render(); return; }
    S.picker={mode:"swap",slot,q:""}; render();});
  document.querySelectorAll("[data-unswap]").forEach(b=>b.onclick=()=>{const slot=b.dataset.unswap,s=S.cur;
    const c=Object.assign({},s.cambios); if(c[slot]){delete c[slot]; s.cambios=c;} else { const sw=Object.assign({},S.aj.swaps); sw[s.tipo]=Object.assign({},sw[s.tipo]); delete sw[s.tipo][slot]; S.aj.swaps=sw; saveAj(); }
    touch(s); render();});
  document.querySelectorAll("[data-quit]").forEach(b=>b.onclick=()=>{const s=S.cur, slot=b.dataset.quit;
    if((s.extras||[]).includes(slot)) s.extras=s.extras.filter(x=>x!==slot); else s.quitados=(s.quitados||[]).concat([slot]);
    touch(s); render(); toast("Quitado por hoy");});
  document.querySelectorAll("[data-unquit]").forEach(b=>b.onclick=()=>{const s=S.cur; s.quitados=(s.quitados||[]).filter(x=>x!==b.dataset.unquit); touch(s); render();});
  document.querySelectorAll("[data-addset]").forEach(b=>b.onclick=()=>{const s=S.cur,id=b.dataset.addset; const e=curEx(id); const cur=Math.max(e?e.s:3,(s.ejercicios[id]||[]).length); s.nsets=Object.assign({},s.nsets,{[id]:cur+1}); touch(s); render();});
  document.querySelectorAll("[data-rmset]").forEach(b=>b.onclick=()=>{const s=S.cur,id=b.dataset.rmset; const e=curEx(id); const cur=Math.max(e?e.s:3,(s.ejercicios[id]||[]).length); if(cur<=1) return;
    const arr=(s.ejercicios[id]||[]).slice(0,cur-1); s.ejercicios=Object.assign({},s.ejercicios,{[id]:arr}); s.nsets=Object.assign({},s.nsets,{[id]:cur-1}); touch(s); render();});
  const lh=$("#loadHealth"); if(lh) lh.onclick=()=>loadHealth();
  const lo=$("#logout"); if(lo) lo.onclick=async()=>{await flush(); if(Object.keys(outbox).length){toast("Hay cambios sin subir. Conéctate antes de salir.");return} await sb.auth.signOut(); LS.set("cache",null); location.reload()};
}
function P_ex(id){return Object.values(PROGRAM).flatMap(p=>p.ex).find(e=>e.id===id)}
$("#tPlus").onclick=()=>{if(S.timer){S.timer.end=Math.max(S.timer.end,Date.now())+15000;S.timer.total+=15;S.timer.rang=false;$("#timer").classList.remove("done")}};
$("#tStop").onclick=stopTimer;
function go(tab){S.tab=tab;try{localStorage.setItem("tab",tab)}catch(e){};render();window.scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.tab));

/* ============ Datos del reloj (Supabase) ============ */
async function loadHealth(){
  if(!sb||!S.user){S.healthState="none";return}
  S.healthState="loading";
  const {data,error}=await sb.from("health_daily").select("fecha,pasos,sueno_horas,hora_dormir,hora_despertar,fc_reposo,vfc,energia_activa").order("fecha",{ascending:false}).limit(120);
  if(error){S.healthState="error";S.healthErr=error.message;render();return}
  S.health={}; (data||[]).forEach(r=>{S.health[String(r.fecha).slice(0,10)]=r});
  S.healthState="ok"; cacheLocal(); render();
}

/* ============ Arranque ============ */
(function(){const c=LS.get("cache",null); if(c){S.days=c.days||{};S.sessions=c.sessions||{};S.health=c.health||{};S.aj=c.aj||{};S.ready=true;}
  for(const k in outbox){const o=outbox[k]; if(o.table==="dias") S.days[o.row.fecha]=o.row.data; else if(o.table==="ajustes") S.aj=o.row.data; else S.sessions[o.row.id]=o.row.data;}})();
render(); syncUI();
async function loadAll(){
  const [d,ss,aj]=await Promise.all([
    sb.from("dias").select("fecha,data").order("fecha",{ascending:false}).limit(1000),
    sb.from("sesiones").select("id,data").order("fecha",{ascending:false}).limit(1000),
    sb.from("ajustes").select("data").maybeSingle()]);
  if(d.error||ss.error){ if(!S.ready){S.ready=true;render()} showBanner("No pude leer tus datos ("+((d.error||ss.error).message)+"). Muestro lo último guardado en el teléfono."); return; }
  const days={}; d.data.forEach(r=>{days[String(r.fecha).slice(0,10)]=r.data});
  const sess={}; ss.data.forEach(r=>{sess[r.id]=r.data});
  for(const k in outbox){const o=outbox[k]; if(o.table==="dias") days[o.row.fecha]=o.row.data; else if(o.table==="sesiones") sess[o.row.id]=o.row.data;}
  if(aj&&!aj.error&&aj.data&&aj.data.data&&!outbox.ajustes) S.aj=aj.data.data;
  S.days=days; S.sessions=sess; S.ready=true; cacheLocal();
  if(!isTyping()) render();
}
async function onUser(user){
  S.user=user; S.needLogin=!user;
  if(!user){render();return}
  render(); await loadAll(); flush(); loadHealth(); loadFotos();
}
if(!sb){ S.ready=true; render(); showBanner("No cargó la conexión con tus datos. Revisa tu internet y vuelve a abrir la app."); }
else{
  sb.auth.getSession().then(({data})=>onUser(data.session&&data.session.user||null));
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==="SIGNED_IN"&&(!S.user||S.user.id!==session.user.id)) onUser(session.user); if(ev==="SIGNED_OUT") onUser(null); });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.user&&!isTyping()){ loadAll(); loadHealth(); flush(); } });
}
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
function isTyping(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")}
function showBanner(msg){const b=$("#statusBanner");b.className="banner warn";b.innerHTML=`<span class="plate" style="background:var(--plate-y)"></span><div>${esc(msg)}</div>`;b.hidden=false}
})();
</script>
