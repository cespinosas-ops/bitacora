/* ============ Utilidades ============ */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd = d=>d.toLocaleDateString("sv-SE");
const parse = s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today = ()=>ymd(new Date());
const weekOf = s=>Math.floor((parse(s)-parse(START))/864e5/7)+1;
const mondayOf = s=>{const d=parse(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)};
const DOW=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MON=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const pretty = s=>{const d=parse(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const avg = a=>{const v=a.filter(x=>typeof x==="number"&&!isNaN(x));return v.length?v.reduce((p,c)=>p+c,0)/v.length:null};
const fmt=(n,d=1)=>n==null?"–":n.toFixed(d).replace(".",",");
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800)}
function phase(w){
  if(w<=1) return {k:"medir",txt:"Semana de medición. Elige pesos con los que te queden 3 repeticiones en reserva y anota todo. Así partimos con números reales."};
  if(w===7) return {k:"descarga",txt:"Semana de descarga. Una serie menos por ejercicio y 10% menos de peso. Recuperas y vuelves más fuerte."};
  if(w>=13) return {k:"control",txt:"Semana de control. Agenda la nueva antropometría con Kari para comparar con la del 14 de octubre."};
  return {k:"normal",txt:null};
}

/* ============ Estado ============ */
const S = {calMonth:null, calSel:null, tab:"hoy", days:{}, sessions:{}, health:{}, healthState:"idle", user:null, ready:false, pick:null};
try{ const t=localStorage.getItem("tab"); if(t) S.tab=t; }catch(e){}

/* ============ Persistencia ============ */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pending = {};
let outbox = LS.get("outbox",{});   // key -> {table,row}
function cacheLocal(){LS.set("cache",{days:S.days,sessions:S.sessions,health:S.health})}
function queue(key,table,row){outbox[key]={table,row};LS.set("outbox",outbox);cacheLocal();clearTimeout(pending[key]);pending[key]=setTimeout(flush,600);syncUI()}
let flushing=false;
async function flush(){
  if(flushing||!sb||!S.user) return; flushing=true;
  try{
    for(const key of Object.keys(outbox)){
      const {table,row}=outbox[key]; if(!row.user_id) row.user_id=S.user.id;
      const {error}=await sb.from(table).upsert(row);
      if(error){ if(!navigator.onLine||/fetch|network/i.test(error.message||"")) break; toast("No se pudo guardar: "+error.message); break; }
      if(outbox[key]&&outbox[key].row===row){ delete outbox[key]; LS.set("outbox",outbox); }
      delete pending[key];
    }
  }catch(e){} finally{flushing=false; syncUI()}
}
function syncUI(){const el=$("#syncState");if(!el)return;const n=Object.keys(outbox).length;el.textContent=n?(navigator.onLine?"guardando…":"sin señal · "+n+" por subir"):"";}
window.addEventListener("online",flush); setInterval(flush,20000);
function saveDay(date, patch){
  const cur = Object.assign({fecha:date}, S.days[date]||{});
  deepMerge(cur, patch);
  S.days[date]=cur;
  queue("d"+date,"dias",Object.assign(S.user?{user_id:S.user.id}:{},{fecha:date,data:cur,updated_at:new Date().toISOString()}));
}
function saveSession(id, obj){
  S.sessions[id]=obj;
  queue("s"+id,"sesiones",Object.assign(S.user?{user_id:S.user.id}:{},{id,fecha:obj.fecha,data:obj,updated_at:new Date().toISOString()}));
}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])){a[k]=deepMerge(Object.assign({},a[k]||{}),b[k])}else a[k]=b[k]}return a}

/* ============ Lógica de entrenamiento ============ */
function sessionList(){return Object.values(S.sessions).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.creado||0)-(b.creado||0))}
function nextType(){
  const done = sessionList().filter(s=>s.terminada);
  if(!done.length) return "TA";
  const last = done[done.length-1].tipo;
  return ROTATION[(ROTATION.indexOf(last)+1)%4];
}
function weekSessions(mon){const end=addDays(mon,6);return sessionList().filter(s=>s.terminada&&s.fecha>=mon&&s.fecha<=end)}
function lastFor(exId, beforeId){
  const list = sessionList().filter(s=>s.id!==beforeId && s.ejercicios && s.ejercicios[exId] && s.ejercicios[exId].some(x=>x&&x.kg!=null&&x.reps!=null));
  return list.length? list[list.length-1].ejercicios[exId].filter(x=>x&&x.kg!=null&&x.reps!=null):null;
}
function suggestion(ex, beforeId, w){
  const last = lastFor(ex.id, beforeId);
  if(!last) return {txt:w<=1?"Primera vez: busca un peso que te deje 3 reps en reserva.":"Sin registro previo: parte conservador.",kg:null};
  const topKg = Math.max(...last.map(x=>+x.kg));
  const top = last.filter(x=>+x.kg===topKg);
  const allHit = last.length>=ex.s && top.every(x=>+x.reps>=ex.hi);
  const prev = last.map(x=>`${fmtKg(x.kg)}×${x.reps}`).join(", ");
  if(w===7){const k=Math.round(topKg*0.9/1.25)*1.25;return {txt:`La vez pasada: ${prev}. Descarga: ${fmtKg(k)} kg, una serie menos.`,kg:k}}
  if(allHit && ex.inc>0) return {txt:`La vez pasada: ${prev}. Llegaste arriba en todo: sube a <b>${fmtKg(topKg+ex.inc)} kg</b> y vuelve a ${ex.lo} reps.`,kg:topKg+ex.inc};
  return {txt:`La vez pasada: ${prev}. Mismo peso, <b>${fmtKg(topKg)} kg</b>, y busca una rep más.`,kg:topKg};
}
function platesFor(kg,bar){let side=(kg-bar)/2; if(side<=0) return `Solo la barra (${bar} kg)`;
  const out=[];for(const p of [25,20,15,10,5,2.5,1.25]){while(side>=p-1e-9){out.push(p);side-=p}}
  return `Por lado: ${out.map(fmtKg).join(" + ")}${side>0.01?" (sobra "+fmtKg(side*2)+" kg)":""} · barra ${bar} kg`;}
function bestBefore(exId,sid){let b=0;for(const s of sessionList()){if(s.id===sid)continue;((s.ejercicios||{})[exId]||[]).forEach(x=>{if(x&&x.kg!=null&&x.reps!=null)b=Math.max(b,e1rm(+x.kg,+x.reps))})}return b}
function sessStats(s){let vol=0,n=0;Object.values(s.ejercicios||{}).forEach(a=>a.forEach(x=>{if(x&&x.ok){n++;vol+=(+x.kg||0)*(+x.reps||0)}}));return {vol,n}}
function updSessbar(){const el=$("#sessbar");if(!el||!S.cur)return;const st=sessStats(S.cur);const mins=S.cur.inicio?Math.floor((Date.now()-S.cur.inicio)/60000):0;
  el.innerHTML=`<span>Duración <b>${S.cur.inicio?mins+" min":"sin partir"}</b></span><span>Series <b>${st.n}</b></span><span>Volumen <b>${Math.round(st.vol).toLocaleString("es-CL")} kg</b></span>`}
setInterval(updSessbar,15000);
async function wake(on){try{if(on&&!S.wl&&navigator.wakeLock){S.wl=await navigator.wakeLock.request("screen");S.wl.addEventListener("release",()=>{S.wl=null})}else if(!on&&S.wl){await S.wl.release();S.wl=null}}catch(e){}}
function restOf(ex,idx){return ex.rest||(ex.ss?90:(idx<2?120:75))}
function mmss(t){t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function startTimer(sec,lab){document.body.classList.add("timing");S.timer={end:Date.now()+sec*1000,total:sec,lab};$("#timer").hidden=false;$("#timer").classList.remove("done");tick();clearInterval(S.tI);S.tI=setInterval(tick,250)}
function tick(){const T=S.timer;if(!T)return;const left=(T.end-Date.now())/1000;
  $("#tT").textContent=left>0?mmss(left):"0:00";$("#tL").textContent=left>0?"Descanso · "+T.lab:"A la siguiente serie";
  $("#tB").style.width=Math.max(0,Math.min(100,(1-left/T.total)*100))+"%";
  if(left<=0&&!T.rang){T.rang=true;$("#timer").classList.add("done");try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.25)}catch(e){}
    setTimeout(()=>{if(S.timer===T)stopTimer()},8000)}}
function stopTimer(){document.body.classList.remove("timing");clearInterval(S.tI);S.timer=null;$("#timer").hidden=true}
function fmtKg(k){return String(+(+k).toFixed(2)).replace(".",",")}

function stepsOf(date){const h=S.health[date];if(h&&h.pasos!=null)return +h.pasos;const d=S.days[date];return d&&d.pasos!=null?+d.pasos:null}
function stepsRow(t){

}
function currentSession(){
  const t=today();
  const open = sessionList().filter(s=>s.fecha===t&&!s.terminada);
  if(S.pick){ const ex=sessionList().find(s=>s.fecha===t&&s.tipo===S.pick&&!s.terminada); return ex||{id:t+"_"+S.pick+"_"+Date.now().toString(36),fecha:t,tipo:S.pick,semana:weekOf(t),ejercicios:{},terminada:false,creado:Date.now(),nuevo:true}; }

}

    const kgNow=(rows.find(x=>x&&x.kg!=null)||{}).kg ?? sug.kg;

    return `<div class="ex">

      ${ex.tip?`<div class="hint">${esc(ex.tip)}</div>`:""}

    else exs+=exHtml(ex,k);

  return `<div class="flat">

    ${doneToday.length?`<div class="banner good"><span class="plate" style="background:var(--plate-g)"></span><div>Hoy ya terminaste ${doneToday.map(x=>PROGRAM[x.tipo].name).join(" y ")}.</div></div>`:""}

function weightSpark(days){
  const pts=days.filter(d=>typeof d.peso==="number");
  if(pts.length<2) return `<p class="empty">Registra tu peso unos días y aquí aparece la curva con el promedio móvil.</p>`;
  const W=320,H=120,pl=34,pr=8,pt=10,pb=20;
  const xs=pts.map(p=>parse(p.fecha).getTime());const x0=Math.min(...xs),x1=Math.max(...xs);
  const ys=pts.map(p=>p.peso);let y0=Math.floor(Math.min(...ys)-0.5),y1=Math.ceil(Math.max(...ys)+0.5);
  const X=t=>pl+(x1===x0?0:(t-x0)/(x1-x0))*(W-pl-pr), Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  const ma=pts.map((p,i)=>{const win=pts.filter(q=>parse(q.fecha)<=parse(p.fecha)&&(parse(p.fecha)-parse(q.fecha))/864e5<7);return [X(xs[i]),Y(avg(win.map(q=>q.peso)))]});
  const grid=[y0,(y0+y1)/2,y1].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v,1)}</text>`).join("");
  const dots=pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.peso)}" r="2.5" fill="var(--muted)"/>`).join("");
  const line=ma.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=ma[ma.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Peso diario y promedio de 7 días">${grid}${dots}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--accent)"/><text x="${pl}" y="${H-4}">${pretty(pts[0].fecha).split(" ").slice(1).join(" ")}</text><text x="${W-pr}" y="${H-4}" text-anchor="end">${pretty(pts[pts.length-1].fecha).split(" ").slice(1).join(" ")}</text></svg>`;
}

function weekStats(mon){
  const dates=Array.from({length:7},(_,i)=>addDays(mon,i)).filter(x=>x<=today());
  const ds=dates.map(x=>S.days[x]||{});const hs=dates.map(x=>S.health[x]||{});
  const meals=ds.reduce((a,d)=>a+MEALS.filter(m=>d.comidas&&d.comidas[m.id]!=null).length,0);
  return {n:dates.length,peso:avg(ds.map(d=>d.peso)),ses:weekSessions(mon).length,meals:dates.length?meals/(dates.length*4):null,
    sueno:avg(hs.map(h=>h.sueno_horas!=null?+h.sueno_horas:null)),pasos:avg(dates.map(x=>stepsOf(x))),
    energia:avg(ds.map(d=>d.energia)),animo:avg(ds.map(d=>d.animo)),agua:avg(ds.map(d=>d.agua)),fc:avg(hs.map(h=>h.fc_reposo!=null?+h.fc_reposo:null)),vfc:avg(hs.map(h=>h.vfc!=null?+h.vfc:null))};
}

function exSpark(h){if(h.length<2)return "";const W=320,H=90,pl=30,pr=8,pt=8,pb=16;const ys=h.map(x=>x.best);const y0=Math.floor(Math.min(...ys)*0.97),y1=Math.ceil(Math.max(...ys)*1.03);

  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(prog),"Progreso");
  ROTATION.forEach(k=>{const P=PROGRAM[k];const ss=sessionList().filter(s=>s.tipo===k&&s.terminada);

    XLSX.utils.book_append_sheet(wb,ws,P.name);});

  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const name="Bitacora Cristobal "+today()+".xlsx";
  const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  try{
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("Excel listo")
}

function viewLogin(){
  return `<div class="login">
    <div><div class="eyebrow">Entreno · comida · sueño</div><h2 style="font-size:30px">Tu coach diario</h2><p class="muted small">Entra con tu cuenta para ver tus datos en cualquier dispositivo.</p></div>
    <button class="btn primary gbtn" id="gLogin"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>Entrar con Google</button>
    <details><summary>Entrar con un link por email</summary><div class="in flat"><input id="mail" type="email" autocomplete="email" placeholder="tu@email.com"><button class="btn" id="mLogin">Mandarme el link</button></div></details>
    <p class="small muted" id="loginMsg"></p>
  </div>`;
}
function bindLogin(){
  const redirect=location.origin+location.pathname;
  const g=$("#gLogin"); if(g) g.onclick=async()=>{const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:redirect,queryParams:{prompt:"select_account"}}}); if(error) $("#loginMsg").textContent="No se pudo abrir Google: "+error.message};
  const m=$("#mLogin"); if(m) m.onclick=async()=>{const email=$("#mail").value.trim(); if(!email){toast("Escribe tu email");return} const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect}}); $("#loginMsg").textContent=error?("No se pudo mandar: "+error.message):"Listo. Revisa tu correo y abre el link desde este mismo teléfono.";};
}

/* ============ Eventos ============ */
function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const t=today();
  const num=(id,key)=>{const el=$("#"+id);if(el)el.onchange=()=>{const v=el.value===""?null:parseFloat(el.value.replace(",","."));saveDay(t,{[key]:v});toast("Guardado")}};
  num("peso","peso"); num("cintura","cintura");
  const pa=$("#pasosAyer"); if(pa) pa.onchange=()=>{saveDay(addDays(t,-1),{pasos:pa.value===""?null:parseInt(pa.value,10)});toast("Guardado");render()};
  document.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>{S.calSel=b.dataset.cal;render()});
  document.querySelectorAll("[data-mon]").forEach(b=>b.onclick=()=>{const [y,m]=S.calMonth.split("-").map(Number);const d=new Date(y,m-1+(+b.dataset.mon),1);S.calMonth=ymd(d).slice(0,7);render()});
  const xb=$("#exportX"); if(xb) xb.onclick=exportXlsx;
  const es=$("#exSel"); if(es) es.onchange=()=>{S.exSel=es.value;render()};
  ["dormir","despertar"].forEach(k=>{const el=$("#"+k);if(el)el.onchange=()=>saveDay(t,{[k]:el.value||null})});
  const nota=$("#nota"); if(nota) nota.oninput=()=>saveDay(t,{nota:nota.value});
  document.querySelectorAll("[data-water]").forEach(b=>b.onclick=()=>{const cur=(S.days[t]||{}).agua||0;saveDay(t,{agua:Math.max(0,cur+ +b.dataset.water)});render()});
  document.querySelectorAll("[data-flag]").forEach(b=>b.onclick=()=>{const k=b.dataset.flag;saveDay(t,{[k]:!((S.days[t]||{})[k])});render()});
  document.querySelectorAll("[data-scale]").forEach(b=>b.onclick=()=>{saveDay(t,{[b.dataset.scale]:+b.dataset.v});render()});
  document.querySelectorAll("[data-meal]").forEach(b=>b.onclick=()=>{const c=((S.days[t]||{}).comidas||{});const v=+b.dataset.v;saveDay(t,{comidas:{[b.dataset.meal]:c[b.dataset.meal]===v?null:v}});render()});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{S.pick=b.dataset.pick;render()});
  document.querySelectorAll(".sets input").forEach(inp=>inp.onchange=()=>{
    const s=S.cur; delete s.nuevo; if(!s.inicio) s.inicio=Date.now(); const arr=(s.ejercicios[inp.dataset.ex]||[]).slice();
    const r=Object.assign({},arr[+inp.dataset.i]||{});
    r[inp.dataset.f]= inp.value===""?null:parseFloat(inp.value.replace(",","."));
    arr[+inp.dataset.i]=r; s.ejercicios=Object.assign({},s.ejercicios,{[inp.dataset.ex]:arr});
    for(let i=0;i<arr.length;i++) if(!arr[i]) arr[i]={};
    saveSession(s.id,s);
  });
  document.querySelectorAll(".restbtn").forEach(b=>b.onclick=()=>startTimer(+b.dataset.rest,b.dataset.lab));
  document.querySelectorAll(".sets .ok").forEach(b=>b.onclick=()=>{
    const s=S.cur; delete s.nuevo; if(!s.inicio) s.inicio=Date.now();
    const id=b.dataset.ok,i=+b.dataset.i; const arr=(s.ejercicios[id]||[]).slice(); for(let k=0;k<=i;k++) if(!arr[k]) arr[k]={};
    const r=Object.assign({},arr[i]); const kgI=$("#kg_"+id+"_"+i), rpI=$("#rp_"+id+"_"+i);
    if(r.ok){r.ok=false;arr[i]=r;s.ejercicios=Object.assign({},s.ejercicios,{[id]:arr});saveSession(s.id,s);render();return}
    if(r.kg==null&&kgI.placeholder&&!isNaN(parseFloat(kgI.placeholder.replace(",","."))))r.kg=parseFloat(kgI.placeholder.replace(",","."));
    if(r.reps==null)r.reps=parseInt(rpI.placeholder,10)||null;
    if(r.reps==null){toast("Anota las reps de la serie");return}
    r.ok=true; arr[i]=r; s.ejercicios=Object.assign({},s.ejercicios,{[id]:arr}); saveSession(s.id,s);
    const ex=P_ex(id); const prevBest=bestBefore(id,s.id);
    if(r.kg!=null&&prevBest>0&&e1rm(+r.kg,+r.reps)>prevBest+0.01) setTimeout(()=>toast("Récord en "+ex.n+": "+fmtKg(r.kg)+" × "+r.reps),300);
    try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
    let start=true; if(ex&&ex.ss){const grp=PROGRAM[s.tipo].ex.filter(e=>e.ss===ex.ss); if(grp[grp.length-1].id!==id) start=false;}
    if(start) startTimer(+b.dataset.rest,b.dataset.lab);
    render();
  });
  updSessbar(); wake(S.tab==="entreno");
  const fin=$("#finish"); if(fin) fin.onclick=()=>{
    const s=S.cur; const any=Object.values(s.ejercicios||{}).some(a=>a.some(x=>x&&x.reps!=null));
    if(!any){toast("Anota al menos una serie antes de terminar");return}
    delete s.nuevo; s.terminada=true; s.terminadaEn=Date.now(); if(s.inicio) s.minutos=Math.round((s.terminadaEn-s.inicio)/60000); const st=sessStats(s); s.volumen=Math.round(st.vol); saveSession(s.id,s); S.pick=null; toast(PROGRAM[s.tipo].name+" guardado"); go("hoy");
  };
  const lh=$("#loadHealth"); if(lh) lh.onclick=()=>loadHealth();
  const lo=$("#logout"); if(lo) lo.onclick=async()=>{await flush(); if(Object.keys(outbox).length){toast("Hay cambios sin subir. Conéctate antes de salir.");return} await sb.auth.signOut(); LS.set("cache",null); location.reload()};
}
function P_ex(id){return Object.values(PROGRAM).flatMap(p=>p.ex).find(e=>e.id===id)}
$("#tPlus").onclick=()=>{if(S.timer){S.timer.end=Math.max(S.timer.end,Date.now())+15000;S.timer.total+=15;S.timer.rang=false;$("#timer").classList.remove("done")}};
$("#tStop").onclick=stopTimer;
function go(tab){S.tab=tab;try{localStorage.setItem("tab",tab)}catch(e){};render();window.scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.tab));

/* ============ Datos del reloj (Supabase) ============ */
async function loadHealth(){
  if(!sb||!S.user){S.healthState="none";return}
  S.healthState="loading";
  const {data,error}=await sb.from("health_daily").select("fecha,pasos,sueno_horas,hora_dormir,hora_despertar,fc_reposo,vfc,energia_activa").order("fecha",{ascending:false}).limit(120);
  if(error){S.healthState="error";S.healthErr=error.message;render();return}
  S.health={}; (data||[]).forEach(r=>{S.health[String(r.fecha).slice(0,10)]=r});
  S.healthState="ok"; cacheLocal(); render();
}

/* ============ Arranque ============ */
(function(){const c=LS.get("cache",null); if(c){S.days=c.days||{};S.sessions=c.sessions||{};S.health=c.health||{};S.ready=true;}
  for(const k in outbox){const o=outbox[k]; if(o.table==="dias") S.days[o.row.fecha]=o.row.data; else S.sessions[o.row.id]=o.row.data;}})();
render(); syncUI();
async function loadAll(){
  const [d,ss]=await Promise.all([
    sb.from("dias").select("fecha,data").order("fecha",{ascending:false}).limit(1000),
    sb.from("sesiones").select("id,data").order("fecha",{ascending:false}).limit(1000)]);
  if(d.error||ss.error){ if(!S.ready){S.ready=true;render()} showBanner("No pude leer tus datos ("+((d.error||ss.error).message)+"). Muestro lo último guardado en el teléfono."); return; }
  const days={}; d.data.forEach(r=>{days[String(r.fecha).slice(0,10)]=r.data});
  const sess={}; ss.data.forEach(r=>{sess[r.id]=r.data});
  for(const k in outbox){const o=outbox[k]; if(o.table==="dias") days[o.row.fecha]=o.row.data; else sess[o.row.id]=o.row.data;}
  S.days=days; S.sessions=sess; S.ready=true; cacheLocal();
  if(!isTyping()) render();
}
async function onUser(user){
  S.user=user; S.needLogin=!user;
  if(!user){render();return}
  render(); await loadAll(); flush(); loadHealth();
}
if(!sb){ S.ready=true; render(); showBanner("No cargó la conexión con tus datos. Revisa tu internet y vuelve a abrir la app."); }
else{
  sb.auth.getSession().then(({data})=>onUser(data.session&&data.session.user||null));
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==="SIGNED_IN"&&(!S.user||S.user.id!==session.user.id)) onUser(session.user); if(ev==="SIGNED_OUT") onUser(null); });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.user&&!isTyping()){ loadAll(); loadHealth(); flush(); } });
}
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
function isTyping(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")}
function showBanner(msg){const b=$("#statusBanner");b.className="banner warn";b.innerHTML=`<span class="plate" style="background:var(--plate-y)"></span><div>${esc(msg)}</div>`;b.hidden=false}
})();
</script>
